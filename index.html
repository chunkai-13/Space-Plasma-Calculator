<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>太空電漿物理計算與單位查詢工具 | Space Plasma Calculator</title>
  
  <!-- App 圖示與 PWA 配置 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plasma Calc">

  <!-- 樣式表與 KaTeX 數學排版庫 -->
  <link rel="stylesheet" href="katex/katex.min.css?v=5.0">
  <link rel="stylesheet" href="styles.css?v=5.6">
  <script src="katex/katex.min.js?v=5.0"></script>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="icon.png" alt="App Icon" class="brand-icon">
      <span class="brand-title" data-i18n="appTitle">太空電漿物理計算與單位查詢工具</span>
    </div>
    <div class="nav-controls">
      <button type="button" class="btn-ctrl" id="theme-toggle-btn" title="切換深色/淺色模式">
        <span class="icon">☀️</span>
        <span class="theme-text">淺色模式</span>
      </button>
      <button type="button" class="btn-ctrl" id="lang-toggle-btn" title="Switch Language">
        English
      </button>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="app-container">

    <!-- 三大分頁切換列 (預設啟用方程式速算庫) -->
    <nav class="tabs-header" id="main-tabs-nav" role="tablist" aria-label="工作區導覽">
      <button type="button" class="tab-btn nav-item active" data-tab="presets" id="tab-btn-presets" role="tab" aria-controls="section-presets" aria-selected="true" tabindex="0">
        <span class="tab-icon">📐</span> <span data-i18n="tabEq">方程式速算庫</span>
      </button>
      <button type="button" class="tab-btn nav-item" data-tab="builder" id="tab-btn-builder" role="tab" aria-controls="section-builder" aria-selected="false" tabindex="-1">
        <span class="tab-icon">⚡</span> <span data-i18n="tabCalc">自訂運算工作台</span>
      </button>
      <button type="button" class="tab-btn nav-item" data-tab="units" id="tab-btn-units" role="tab" aria-controls="section-units" aria-selected="false" tabindex="-1">
        <span class="tab-icon">📖</span> <span data-i18n="tabLookup">單位與常數手冊</span>
      </button>
    </nav>

    <!-- 分頁一 (首頁)：太空物理方程式速算庫 -->
    <section class="tab-content tab-pane active" id="section-presets" data-tab-pane="presets" role="tabpanel" aria-labelledby="tab-btn-presets">
      <div class="card">
        <h2 class="card-title" data-i18n="eqTitle">太空物理方程式速算庫</h2>

        <!-- 太空環境典型場景快捷列 (Environment Presets Bar) -->
        <div class="env-presets-container">
          <span class="env-presets-title" data-i18n="envPresetsTitle">太空環境典型場景：</span>
          <button type="button" class="env-pill-btn active" data-env-preset="solar_wind_1au" data-i18n="envSolarWind">⚡ 1 AU 太陽風</button>
          <button type="button" class="env-pill-btn" data-env-preset="magnetopause" data-i18n="envMagnetopause">🛡️ 地球磁層頂</button>
          <button type="button" class="env-pill-btn" data-env-preset="magnetotail" data-i18n="envMagnetotail">🌌 地球磁尾</button>
          <button type="button" class="env-pill-btn" data-env-preset="ionosphere_f" data-i18n="envIonosphere">🌍 電離層 F層</button>
          <button type="button" class="btn-reset-preset" id="btn-reset-env-preset" title="一鍵還原至當前場景之標準預設值" data-i18n="btnResetPreset" style="display: none;">↺ 還原預設值</button>
        </div>

        <!-- 方程式分類快捷篩選標籤 (Category Filter Pills) -->
        <div class="eq-filter-pills" id="eq-filter-pills">
          <button type="button" class="eq-filter-pill active" data-cat="all" data-i18n="filterAll">全部</button>
          <button type="button" class="eq-filter-pill" data-cat="particle_motion" data-i18n="filterParticle">單粒子運動</button>
          <button type="button" class="eq-filter-pill" data-cat="waves_mhd" data-i18n="filterMhd">MHD 波動</button>
          <button type="button" class="eq-filter-pill" data-cat="characteristic_scales" data-i18n="filterScales">特徵頻率與尺度</button>
          <button type="button" class="eq-filter-pill" data-cat="jump_conditions" data-i18n="filterShocks">震波跳躍條件</button>
          <button type="button" class="eq-filter-pill" data-cat="velocity_distributions" data-i18n="filterDist">速度分布</button>
          <button type="button" class="eq-filter-pill" data-cat="electrodynamics" data-i18n="filterElectro">電磁場能量</button>
        </div>

        <!-- 關鍵字搜尋框 -->
        <div class="search-box eq-search-wrapper">
          <input type="text" id="eq-search-input" class="form-input" placeholder="搜尋方程式 (例如: Alfven, 迴旋, Kappa, Rankine, 德拜)..." data-i18n="eqSearchPlaceholder">
          <button type="button" id="btn-clear-eq-search" class="btn-clear-search" style="display: none;" title="清除搜尋">✕</button>
        </div>
        <!-- 即時搜尋候選結果回饋列 -->
        <div id="eq-search-feedback" class="search-feedback-bar"></div>

        <!-- 兩層分類下拉選單 -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" data-i18n="eqCatLabel">方程式類別：</label>
            <select id="eq-cat-select" class="form-select"></select>
          </div>
          <div class="form-group flex-2">
            <label class="form-label" data-i18n="selectEq">選擇方程式：</label>
            <select id="eq-select" class="form-select"></select>
          </div>
        </div>

        <!-- 方程式數學公式卡片 -->
        <div class="formula-display-card" style="margin-top: 1.25rem;">
          <div class="formula-math" id="eq-formula-display">--</div>
          <div class="formula-desc" id="eq-desc-display">--</div>
        </div>

        <!-- 智慧參數輸入表單 (Smart Inputs) -->
        <h3 class="card-title" style="margin-top: 1.5rem;" data-i18n="paramInputs">智慧參數輸入：</h3>
        <div id="eq-inputs-container"></div>

        <div style="margin-top: 1.25rem;">
          <button type="button" class="btn btn-large" id="btn-compute-eq" data-i18n="btnComputeEq">計算此方程式</button>
        </div>

        <!-- 計算結果輸出 -->
        <div style="margin-top: 1.5rem;">
          <h3 class="card-title" data-i18n="eqResultTitle">方程式解算結果</h3>
          <div id="eq-result-box"></div>
        </div>
      </div>
    </section>

    <!-- 分頁二：自訂運算工作台 (Custom Builder) -->
    <section class="tab-content tab-pane" id="section-builder" data-tab-pane="builder" role="tabpanel" aria-labelledby="tab-btn-builder">
      <div class="card">
        <h2 class="card-title" data-i18n="builderTitle">自訂運算工作台</h2>
        <p class="card-desc" data-i18n="builderDesc">自由組合物理量與常數，支援所見即所得點擊游標定位與 LaTeX 快捷語法雙軌輸入，即時因次檢驗。</p>

        <!-- 經典預設範例按鈕列 -->
        <div class="presets-bar">
          <span data-i18n="presetLabel">快速帶入經典範例：</span>
          <button type="button" class="preset-btn" data-preset="presetPB" data-i18n="presetPB">磁壓力 (B² / 2μ₀)</button>
          <button type="button" class="preset-btn" data-preset="presetTotalP" data-i18n="presetTotalP">總壓力 (P_th + P_B)</button>
          <button type="button" class="preset-btn" data-preset="presetBracket" data-i18n="presetBracket">巢狀括號 [ (P_B) + P_th ]</button>
          <button type="button" class="preset-btn" data-preset="presetBeta" data-i18n="presetBeta">電漿 Beta (nkT / P_B)</button>
          <button type="button" class="preset-btn" data-preset="presetVA" data-i18n="presetVA">阿爾芬速度 (B / √(μ₀ ρ))</button>
        </div>

        <!-- 雙模公式輸入區 (WYSIWYG KaTeX + Quick LaTeX) -->
        <div class="dual-mode-box">
          <div class="equation-preview-board">
            <div class="preview-header">
              <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                <span class="preview-title" data-i18n="previewTitle">目前建構的方程式：</span>
                <div class="history-ctrl-group">
                  <button type="button" class="btn-history" id="btn-undo" title="上一步 (Command + Z)" data-i18n="btnUndo" disabled>↶ 上一步</button>
                  <button type="button" class="btn-history" id="btn-redo" title="下一步 (Command + Shift + Z)" data-i18n="btnRedo" disabled>↷ 下一步</button>
                </div>
              </div>
              <span class="dim-status-badge dim-badge-modern valid" id="dim-status-badge">因次檢驗就緒</span>
            </div>
            <!-- 點擊聚焦方程式可視化看板 -->
            <div class="interactive-formula-container" id="interactive-formula-container">
              <div class="preview-formula-math" id="preview-formula-math">--</div>
            </div>
            <div class="preview-cursor-hint" id="preview-cursor-hint" data-i18n="previewCursorTip">
              💡 點擊上方公式的任何符號前後或分式的分子/分母格，即可將光標移至該處插入新項目。
            </div>
          </div>

          <!-- LaTeX 快速輸入列 -->
          <div class="latex-quick-input-bar">
            <span style="font-size: 0.825rem; font-weight: 600; color: var(--text-muted);">⌨️ LaTeX:</span>
            <input type="text" id="latex-quick-input" class="latex-quick-input" placeholder="貼上或輸入 LaTeX 語法，例如 \frac{B^2}{2\mu_0}..." data-i18n="quickLatexPlaceholder">
            <button type="button" id="btn-parse-latex" class="btn-parse-latex" data-i18n="btnParseLatex">解析套用</button>
          </div>
        </div>

        <!-- 單位不符警示橫幅 -->
        <div class="mismatch-warning-card" id="mismatch-warning-card" style="display: none;"></div>

        <!-- 收合式標籤分類符號庫 (Categorized Pill Tabs) -->
        <div class="symbol-pill-panel">
          <div class="symbol-tab-nav" id="symbol-tab-nav">
            <button type="button" class="symbol-tab-btn active" data-sym-cat="const" data-i18n="symTabConst">物理常數 (Constants)</button>
            <button type="button" class="symbol-tab-btn" data-sym-cat="field" data-i18n="symTabField">場量 (Fields)</button>
            <button type="button" class="symbol-tab-btn" data-sym-cat="fluid" data-i18n="symTabFluid">流體與動力學量 (Fluids)</button>
            <button type="button" class="symbol-tab-btn" data-sym-cat="op" data-i18n="symTabOp">運算結構 (Operators)</button>
          </div>
          <div class="symbol-pills-row" data-sym-cat="const">
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="e"><strong>e</strong> <span data-i18n="symConstE">基本電荷</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="me"><strong>m_e</strong> <span data-i18n="symConstMe">電子質量</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="mp"><strong>m_p</strong> <span data-i18n="symConstMp">質子質量</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="eps0"><strong>ε₀</strong> <span data-i18n="symConstEps0">介電常數</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="mu0"><strong>μ₀</strong> <span data-i18n="symConstMu0">磁導率</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="kB"><strong>k_B</strong> <span data-i18n="symConstKb">玻茲曼常數</span></button>
            <button type="button" class="symbol-pill" data-sym-type="constant" data-sym-id="c"><strong>c</strong> <span data-i18n="symConstC">光速</span></button>
          </div>
          <div class="symbol-pills-row" data-sym-cat="field" style="display: none;">
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="magnetic_field"><strong>B</strong> <span data-i18n="symFieldB">磁場強度</span></button>
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="electric_field"><strong>E</strong> <span data-i18n="symFieldE">電場強度</span></button>
          </div>
          <div class="symbol-pills-row" data-sym-cat="fluid" style="display: none;">
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="density"><strong>n</strong> <span data-i18n="symFluidN">數密度</span></button>
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="temperature"><strong>T</strong> <span data-i18n="symFluidT">電漿溫度</span></button>
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="velocity"><strong>v</strong> <span data-i18n="symFluidV">粒子速度</span></button>
            <button type="button" class="symbol-pill" data-sym-type="quantity" data-sym-id="pressure"><strong>P</strong> <span data-i18n="symFluidP">電漿壓力</span></button>
          </div>
          <div class="symbol-pills-row" data-sym-cat="op" style="display: none;">
            <button type="button" class="symbol-pill" data-sym-type="operator" data-sym-id="+"><strong>＋</strong> <span data-i18n="symOpAdd">加法</span></button>
            <button type="button" class="symbol-pill" data-sym-type="operator" data-sym-id="-"><strong>－</strong> <span data-i18n="symOpSub">減法</span></button>
            <button type="button" class="symbol-pill" data-sym-type="operator" data-sym-id="*"><strong>·</strong> <span data-i18n="symOpMul">乘法</span></button>
            <button type="button" class="symbol-pill" data-sym-type="operator" data-sym-id="/"><strong>/</strong> <span data-i18n="symOpDiv">除法</span></button>
            <button type="button" class="symbol-pill" data-sym-type="fraction" id="btn-add-fraction"><strong>⬚/⬚</strong> <span data-i18n="symOpFrac">分式</span></button>
            <button type="button" class="symbol-pill" data-sym-type="open_paren" id="btn-add-open-paren"><strong>(</strong> <span data-i18n="symOpOpenParen">開括號</span></button>
            <button type="button" class="symbol-pill" data-sym-type="close_paren" id="btn-add-close-paren"><strong>)</strong> <span data-i18n="symOpCloseParen">閉括號</span></button>
          </div>
        </div>

        <!-- 多項式詳細參數卡片清單 (支援個別數值輸入、單位選擇、次方與移動刪除) -->
        <div class="terms-section" style="margin-top: 1.25rem;">
          <div class="terms-section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <h3 class="terms-section-title" data-i18n="itemsListTitle" style="font-size: 1rem; font-weight: 600; color: var(--text-secondary); margin: 0;">多項式項目清單</h3>
            <button type="button" class="btn-toggle-all btn-copy-chip" id="btn-collapse-all" data-i18n="collapseAll">全部收合</button>
          </div>
          <div class="terms-container" id="terms-container"></div>
        </div>

        <!-- 運算執行按鈕列 -->
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
          <button type="button" class="btn btn-large" id="btn-equal" data-i18n="btnEqual" style="flex: 2;">＝ 計算結果</button>
          <button type="button" class="btn btn-secondary btn-danger-text" id="btn-clear-terms" data-i18n="btnClear" style="flex: 1;">清空全部</button>
        </div>
      </div>

      <!-- 計算結果輸出區塊 -->
      <div class="result-card">
        <div class="result-sys-selector">
          <span class="sys-label" data-i18n="outputSystem">輸出制度：</span>
          <div class="radio-group">
            <label>
              <input type="radio" name="display-system" value="Space" checked>
              <span data-i18n="sysSpace">太空常用制 (Space)</span>
            </label>
            <label>
              <input type="radio" name="display-system" value="SI">
              <span data-i18n="sysSI">國際單位制 (SI)</span>
            </label>
            <label>
              <input type="radio" name="display-system" value="CGS">
              <span data-i18n="sysCGS">高斯制 (CGS)</span>
            </label>
          </div>
        </div>

        <div id="result-output-box"></div>
      </div>
    </section>

    <!-- 分頁三：查找單位與換算 (Units Manual) -->
    <section class="tab-content tab-pane" id="section-units" data-tab-pane="units" role="tabpanel" aria-labelledby="tab-btn-units">
      <div class="card">
        <h2 class="card-title" data-i18n="lookupTitle">單位與常數手冊</h2>

        <!-- 關鍵字搜尋框 -->
        <div class="search-box lookup-search-wrapper">
          <input type="text" id="lookup-search-input" class="form-input" placeholder="輸入物理量名稱、英文或代號搜尋 (例如: 磁場, B, Alfven, 密度)..." data-i18n="searchPlaceholder">
          <button type="button" id="btn-clear-lookup-search" class="btn-clear-search" style="display: none;" title="清除搜尋">✕</button>
        </div>
        <!-- 即時搜尋候選結果回饋列 -->
        <div id="lookup-search-feedback" class="search-feedback-bar"></div>

        <!-- 兩層分類下拉選單 -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" data-i18n="catLabel">物理量類別：</label>
            <select id="lookup-cat-select" class="form-select"></select>
          </div>
          <div class="form-group flex-2">
            <label class="form-label" data-i18n="qtyLabel">選擇物理量：</label>
            <select id="lookup-qty-select" class="form-select"></select>
          </div>
        </div>

        <div class="formula-display-card" style="margin-top: 1.25rem;">
          <div id="lookup-desc-box" class="formula-desc"></div>
        </div>

        <!-- 多制度規格對照表 (具備固定表頭 Sticky Header) -->
        <h3 class="card-title" style="margin-top: 1.5rem;" data-i18n="unitTableTitle">單位制度規格對照</h3>
        <div class="sticky-table-wrapper">
          <table class="unit-table">
            <thead>
              <tr>
                <th class="col-sys" style="width: 12%;" data-i18n="tableThSys">制度</th>
                <th class="col-unit" style="width: 23%;" data-i18n="tableThUnit">單位符號與名稱</th>
                <th class="col-factor" style="width: 20%;" data-i18n="tableThFactor">SI 基準換算係數</th>
                <th class="col-desc" style="width: 30%;"><span class="th-full-text" data-i18n="tableThDesc">常用情境與說明</span><span class="th-short-text" data-i18n="tableThDescShort">說明</span></th>
                <th class="col-action" style="width: 15%; text-align: center;" data-i18n="tableThAction">操作</th>
              </tr>
            </thead>
            <tbody id="unit-spec-table-body"></tbody>
          </table>
        </div>

        <!-- 即時單位換算器 -->
        <div class="converter-box">
          <h3 class="card-title" data-i18n="converterTitle">即時單位換算器</h3>
          <div class="form-row">
            <div class="form-group flex-1">
              <label class="form-label" data-i18n="fromLabel">來源數值與單位：</label>
              <input type="number" step="any" id="conv-input-value" class="form-input" value="1">
            </div>
            <div class="form-group flex-1">
              <label class="form-label">&nbsp;</label>
              <select id="conv-from-unit" class="form-select"></select>
            </div>
            <div class="form-group flex-1">
              <label class="form-label" data-i18n="toLabel">目標單位：</label>
              <select id="conv-to-unit" class="form-select"></select>
            </div>
          </div>

          <div class="conv-result-card">
            <div class="form-label" data-i18n="calcConvert">換算結果：</div>
            <div class="conv-val-big font-mono" id="conv-result-display">--</div>
            <div class="conv-factor-text font-mono" id="conv-factor-display">--</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- PWA Service Worker 註冊與自動更新機制 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=4.4').then(reg => {
          reg.update();
        }).catch(() => {});

        let isRefreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!isRefreshing) {
            isRefreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>

  <!-- 基礎常量與多語系字典 -->
  <script src="constants.js?v=4.4"></script>
  <script src="js/i18n.js?v=5.2"></script>
  <script src="js/plasma-core.js?v=4.4"></script>

  <!-- 方程式庫模組與入口 -->
  <script src="js/equations-particle.js?v=4.4"></script>
  <script src="js/equations-mhd-waves.js?v=4.4"></script>
