<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>太空電漿物理計算與單位查詢工具 | Space Plasma Calculator</title>
  
  <!-- App 圖示與 PWA 配置 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plasma Calc">

  <!-- 樣式表與 KaTeX 數學排版庫 -->
  <link rel="stylesheet" href="katex/katex.min.css?v=2.1">
  <link rel="stylesheet" href="styles.css?v=2.1">
  <script src="katex/katex.min.js?v=2.1"></script>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="navbar">
    <div class="nav-brand">
      <img src="icon.png" alt="App Icon" class="brand-icon">
      <span class="brand-title" data-i18n="appTitle">太空電漿物理計算與單位查詢工具</span>
    </div>
    <div class="nav-controls">
      <button type="button" class="btn-ctrl" id="theme-toggle-btn" title="切換深色/淺色模式">
        <span class="icon">☀️</span>
        <span class="theme-text">淺色模式</span>
      </button>
      <button type="button" class="btn-ctrl" id="lang-toggle-btn" title="Switch Language">
        English
      </button>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="app-container">

    <!-- 三大分頁切換列 -->
    <nav class="tabs-header">
      <button type="button" class="tab-btn active" data-tab="calc">
        <span>⚡</span> <span data-i18n="tabCalc">自訂物理量計算</span>
      </button>
      <button type="button" class="tab-btn" data-tab="lookup">
        <span>📖</span> <span data-i18n="tabLookup">查找單位與換算</span>
      </button>
      <button type="button" class="tab-btn" data-tab="equations">
        <span>📐</span> <span data-i18n="tabEq">太空物理方程式</span>
      </button>
    </nav>

    <!-- 分頁一：自訂物理量組合計算機 -->
    <section class="tab-content active" id="tab-calc">
      <div class="card">
        <h2 class="card-title" data-i18n="builderTitle">自訂運算建構區</h2>
        <p class="card-desc" data-i18n="builderDesc">自由組合物理量與常數，設定分子、分母、係數與次方量進行計算。</p>

        <!-- 經典預設範例按鈕列 -->
        <div class="presets-bar">
          <span data-i18n="presetLabel">快速帶入經典範例：</span>
          <button type="button" class="preset-btn" data-preset="presetPB" data-i18n="presetPB">磁壓力 (B² / 2μ₀)</button>
          <button type="button" class="preset-btn" data-preset="presetTotalP" data-i18n="presetTotalP">總壓力 (P_th + P_B)</button>
          <button type="button" class="preset-btn" data-preset="presetBeta" data-i18n="presetBeta">電漿 Beta (nkT / P_B)</button>
          <button type="button" class="preset-btn" data-preset="presetVA" data-i18n="presetVA">阿爾芬速度 (B / √(μ₀ ρ))</button>
        </div>

        <!-- 即時方程式呈現看板 (Equation Preview Board) -->
        <div class="equation-preview-board">
          <div class="preview-header">
            <span class="preview-title" data-i18n="previewTitle">目前建構的方程式：</span>
            <span class="dim-status-badge" id="dim-status-badge">因次檢驗就緒</span>
          </div>
          <div class="preview-formula-math" id="preview-formula-math">--</div>
          <div class="preview-formula-sub" id="preview-formula-sub">--</div>
        </div>

        <!-- 單位不符警示橫幅 -->
        <div class="mismatch-warning-card" id="mismatch-warning-card" style="display: none;"></div>

        <!-- 項目列表容器 -->
        <div class="terms-list" id="terms-container"></div>

        <!-- 按鈕操作列 -->
        <div class="calc-actions-row">
          <button type="button" class="btn btn-secondary" id="btn-add-qty" data-i18n="btnAddQty">＋ 新增物理量</button>
          <button type="button" class="btn btn-secondary" id="btn-add-const" data-i18n="btnAddConst">＋ 插入常用常數</button>
          <button type="button" class="btn btn-secondary" id="btn-clear-terms" data-i18n="btnClear">清空項目</button>
          <button type="button" class="btn btn-large" id="btn-equal" data-i18n="btnEqual">＝ 計算結果</button>
        </div>
      </div>

      <!-- 計算結果輸出區塊 -->
      <div class="result-card">
        <div class="result-sys-selector">
          <span class="sys-label" data-i18n="outputSystem">輸出制度：</span>
          <div class="radio-group">
            <label>
              <input type="radio" name="display-system" value="Space" checked>
              <span data-i18n="sysSpace">太空常用制 (Space)</span>
            </label>
            <label>
              <input type="radio" name="display-system" value="SI">
              <span data-i18n="sysSI">國際單位制 (SI)</span>
            </label>
            <label>
              <input type="radio" name="display-system" value="CGS">
              <span data-i18n="sysCGS">高斯制 (CGS)</span>
            </label>
          </div>
        </div>

        <div id="result-output-box"></div>
      </div>
    </section>

    <!-- 分頁二：查找單位與換算 -->
    <section class="tab-content" id="tab-lookup">
      <div class="card">
        <h2 class="card-title" data-i18n="lookupTitle">物理量與單位對照手冊</h2>

        <!-- 關鍵字搜尋框 -->
        <div class="search-box">
          <input type="text" id="lookup-search-input" class="form-input" placeholder="輸入物理量名稱、英文或代號搜尋 (例如: 磁場, B, Alfven, 密度)..." data-i18n="searchPlaceholder">
        </div>

        <!-- 兩層分類下拉選單 -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" data-i18n="catLabel">物理量類別：</label>
            <select id="lookup-cat-select" class="form-select"></select>
          </div>
          <div class="form-group flex-2">
            <label class="form-label" data-i18n="qtyLabel">選擇物理量：</label>
            <select id="lookup-qty-select" class="form-select"></select>
          </div>
        </div>

        <div class="formula-display-card" style="margin-top: 1.25rem;">
          <div id="lookup-desc-box" class="formula-desc"></div>
        </div>

        <!-- 多制度規格對照表 -->
        <h3 class="card-title" style="margin-top: 1.5rem;" data-i18n="unitTableTitle">單位制度規格對照</h3>
        <div class="table-responsive">
          <table class="unit-table">
            <thead>
              <tr>
                <th style="width: 15%;">制度</th>
                <th style="width: 25%;">單位符號與名稱</th>
                <th style="width: 25%;">SI 基準換算係數</th>
                <th style="width: 35%;">常用情境與說明</th>
              </tr>
            </thead>
            <tbody id="unit-spec-table-body"></tbody>
          </table>
        </div>

        <!-- 即時單位換算器 -->
        <div class="converter-box">
          <h3 class="card-title" data-i18n="converterTitle">即時單位換算器</h3>
          <div class="form-row">
            <div class="form-group flex-1">
              <label class="form-label" data-i18n="fromLabel">來源數值與單位：</label>
              <input type="number" step="any" id="conv-input-value" class="form-input" value="1">
            </div>
            <div class="form-group flex-1">
              <label class="form-label">&nbsp;</label>
              <select id="conv-from-unit" class="form-select"></select>
            </div>
            <div class="form-group flex-1">
              <label class="form-label" data-i18n="toLabel">目標單位：</label>
              <select id="conv-to-unit" class="form-select"></select>
            </div>
          </div>

          <div class="conv-result-card">
            <div class="form-label" data-i18n="calcConvert">換算結果：</div>
            <div class="conv-val-big" id="conv-result-display">--</div>
            <div class="conv-factor-text" id="conv-factor-display">--</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 分頁三：太空物理方程式計算 -->
    <section class="tab-content" id="tab-equations">
      <div class="card">
        <h2 class="card-title" data-i18n="eqTitle">太空物理方程式計算庫</h2>

        <!-- 關鍵字搜尋框 -->
        <div class="search-box">
          <input type="text" id="eq-search-input" class="form-input" placeholder="搜尋方程式 (例如: Alfven, 迴旋, Kappa, Rankine, 德拜)..." data-i18n="eqSearchPlaceholder">
        </div>

        <!-- 兩層分類下拉選單 -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" data-i18n="eqCatLabel">方程式類別：</label>
            <select id="eq-cat-select" class="form-select"></select>
          </div>
          <div class="form-group flex-2">
            <label class="form-label" data-i18n="selectEq">選擇方程式：</label>
            <select id="eq-select" class="form-select"></select>
          </div>
        </div>

        <!-- 方程式數學公式卡片 -->
        <div class="formula-display-card" style="margin-top: 1.25rem;">
          <div class="formula-math" id="eq-formula-display">--</div>
          <div class="formula-desc" id="eq-desc-display">--</div>
        </div>

        <!-- 變數輸入表單 -->
        <h3 class="card-title" style="margin-top: 1.5rem;" data-i18n="paramInputs">參數數值與單位輸入：</h3>
        <div id="eq-inputs-container"></div>

        <div style="margin-top: 1.25rem;">
          <button type="button" class="btn btn-large" id="btn-compute-eq" data-i18n="btnComputeEq">計算此方程式</button>
        </div>

        <!-- 計算結果輸出 -->
        <div style="margin-top: 1.5rem;">
          <h3 class="card-title" data-i18n="eqResultTitle">方程式解算結果</h3>
          <div id="eq-result-box"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- PWA Service Worker 註冊與自動更新機制 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2.1').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>

  <!-- 載入腳本 (加入版本號以防瀏覽器快取舊版) -->
  <script src="constants.js?v=2.1"></script>
  <script src="equations.js?v=2.1"></script>
  <script src="calculator.js?v=2.1"></script>
  <script src="app.js?v=2.1"></script>
</body>
</html>
